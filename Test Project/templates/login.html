<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sarpras</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .auth-card {
        width: min(420px, 92vw);
        background: white;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 12px 30px rgba(185, 28, 28, 0.12);
      }
      .auth-card h1 { margin-bottom: 8px; color: #7f1d1d; }
      .auth-card p { margin-bottom: 20px; color: #6b7280; }
      .auth-form .form-group { margin-bottom: 16px; }
      .auth-links { margin-top: 14px; font-size: 0.9rem; }
      .auth-links a { color: #dc2626; text-decoration: none; }
      .error { color: #b91c1c; background: #fef2f2; padding: 10px; border-radius: 8px; margin-bottom: 14px; }
      .success { color: #166534; background: #f0fdf4; padding: 10px; border-radius: 8px; margin-bottom: 14px; }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <h1 data-i18n="loginTitle">Login Sistem Sarpras</h1>
      <p data-i18n="loginSubtitle">Masuk sebagai pelapor atau petugas.</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      {% if success %}<div class="success">{{ success }}</div>{% endif %}
      <form method="post" class="auth-form">
        <div class="form-group">
          <label for="username" data-i18n="loginUsername">Username</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="loginPassword">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" data-i18n="loginButton">Login</button>
      </form>
      <div class="auth-links">
        <a href="{{ url_for('register') }}" data-i18n="registerLink">Buat akun baru</a>
      </div>
      <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #f3f4f6; text-align: center;">
        <select id="langSelectLogin" style="padding: 8px; border-radius: 6px; border: 1px solid #d1d5db;">
          <option value="id">Indonesia</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
